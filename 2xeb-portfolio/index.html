<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>2XEB — Ebenezer Eshetu · Code / Vision / Design</title>
    <meta name="description" content="Engineer × filmmaker in NYC. A 3D portfolio with a built-in AI assistant — software, ML experiments, and cinematic video work." />
    <meta name="theme-color" content="#050505" />

    <!-- Social cards: how the link unfurls on X, IG DMs, iMessage, Discord.
         og/twitter URLs must be absolute and resolvable. For /log/<slug> the
         Worker (worker/index.ts) rewrites these per piece at the edge. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://2xeb.me/" />
    <meta property="og:site_name" content="2XEB" />
    <meta property="og:title" content="2XEB — Ebenezer Eshetu · Code / Vision / Design" />
    <meta property="og:description" content="Engineer × filmmaker in NYC. A 3D portfolio with a built-in AI assistant — software, ML experiments, and cinematic video work." />
    <meta property="og:image" content="https://2xeb.me/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2XEB — Ebenezer Eshetu · Code / Vision / Design" />
    <meta name="twitter:description" content="Engineer × filmmaker in NYC. A 3D portfolio with a built-in AI assistant — software, ML experiments, and cinematic video work." />
    <meta name="twitter:image" content="https://2xeb.me/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts are self-hosted (@font-face in the bundled CSS). Preload the
         two above-the-fold faces so the swap lands before first paint. -->
    <link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
